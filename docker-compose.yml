version: "3.8"

services:
  db:
    container_name: tesla_postgres
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password@123
      POSTGRES_DB: tesla_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tesla_network

  redis:
    container_name: tesla_redis
    image: redis:6-alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - tesla_network

  backend:
    container_name: tesla_backend
    build: ./server
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:Password@123@db:5432/tesla_db?schema=public
      PORT: 5000
      JWT_SECRET: supersecret-tesla-key
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - tesla_network

  frontend:
    container_name: tesla_frontend
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    restart: always
    ports:
      - "7000:7000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - tesla_network

volumes:
  postgres_data:


networks:
  tesla_network:
    driver: bridge
