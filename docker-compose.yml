version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tesla_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://user:Password@123@db:5432/tesla_db
      # REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret
    depends_on:
      - db
      - redis

  frontend:
    build: ./client
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  postgres_data:
